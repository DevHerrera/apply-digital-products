version: "3.9"

services:
  api:
    build: .
    container_name: apply-digital-products_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: apply_digital_products
      CONTENTFUL_BASE_URL: https://cdn.contentful.com/spaces/
      CONTENTFUL_SPACE_ID: 9xs1613l9f7v
      CONTENTFUL_ACCESS_TOKEN: I-ThsT55eE_B3sCUWEQyDT4VqVO3x__20ufuie9usns
      CONTENTFUL_ENVIRONMENT: master
      CONTENTFUL_CONTENT_TYPE: product
      CONTENTFUL_FETCH_INTERVAL: "*/30 * * * * *"
      JWT_SECRET: superSecretAndSecure 
      JWT_EXPIRES_IN: 1d

    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "npm run migration:run && npm run start:dev"

  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apply_digital_products
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
